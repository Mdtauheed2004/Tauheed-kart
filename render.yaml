# Tauheed Kart — Render deployment blueprint (free tier)
# Deploy: push this folder to a GitHub repo, then in Render choose
# "New +" -> "Blueprint" -> pick the repo. It builds + deploys automatically
# and gives you a permanent, 24x7 public URL.
#
# The secret (admin password) is NOT committed — set it as an env var below.

services:
  - type: web
    name: tauheed-kart
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # --- Admin login password (server-side only, never sent to the browser) ---
      - key: ADMIN_SECRET
        value: Tauheed@2004

      # Where products + orders are saved (store.json). On the free tier the
      # filesystem is ephemeral, so for REALLY durable data across restarts,
      # connect the Google Apps Script backend below (a Google Sheet = permanent).
      - key: DATA_DIR
        value: /tmp/tauheed-kart

      # ---- OPTIONAL: real phone notification on every order ----
      # Telegram (free). Create a bot with @BotFather and fill these two:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # WhatsApp Cloud API (optional):
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      # Any SMS/WhatsApp gateway webhook (optional):
      - key: NOTIFY_WEBHOOK_URL
        sync: false

      # Google Apps Script backend (RECOMMENDED for durable, permanent storage).
      # Deploy apps-script.gs -> Google Sheet -> Web app URL, then paste it here.
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
